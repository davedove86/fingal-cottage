name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Prepare Pages files
        run: |
          dir=.vercel/output/static
          test -f "$dir/_shell.html"
          cp "$dir/_shell.html" "$dir/index.html"
          cp "$dir/_shell.html" "$dir/404.html"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vercel/output/static
      - id: deployment
        uses: actions/deploy-pages@v4
